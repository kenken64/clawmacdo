[package]
name = "clawmacdo-ssh"
version = "0.99.0"
edition = "2021"
description = "SSH/SCP operations and key management for ClawMacdo"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
socket2 = "0.5"
ssh2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

clawmacdo-core = { workspace = true }

# Statically link OpenSSL on macOS so release binaries do not depend on the
# build machine's Homebrew openssl@3 (/opt/homebrew/opt/openssl@3).
[target.'cfg(target_os = "macos")'.dependencies]
ssh2 = { workspace = true, features = ["vendored-openssl"] }




































