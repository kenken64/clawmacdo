name: Hermes native bundle

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Bundles to build and verify (tag pushes always build all)
        type: choice
        options: [all, ubuntu, local]
        default: all
  push:
    tags: ['hermes-bundle-v*']

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.targets != 'local'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check bundle integrity handling
        run: python3 tests/unit/test_hermes_bundle.py
      - name: Build pinned native software on a clean VM
        run: bash scripts/hermes-bundle/build.sh "$RUNNER_TEMP/hermes-artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-ubuntu-24.04-${{ matrix.arch }}
          path: ${{ runner.temp }}/hermes-artifacts/*
          compression-level: 0
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hermes-ubuntu-24.04-${{ matrix.arch }}
          path: ${{ runner.temp }}/hermes-artifacts
      - name: Verify install on a fresh VM with networking disabled for Hermes
        run: sudo --preserve-env=GITHUB_ACTIONS bash scripts/hermes-bundle/verify.sh "$RUNNER_TEMP/hermes-artifacts"

  build-local:
    if: github.event_name != 'workflow_dispatch' || inputs.targets != 'ubuntu'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macos-arm64
          - runner: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned native software on a clean macOS runner
        if: runner.os == 'macOS'
        run: bash scripts/hermes-bundle/build-local.sh "$RUNNER_TEMP/hermes-artifacts" "$RUNNER_TEMP/hermes-report/paths.txt"
      - name: Build pinned native software on a clean Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/hermes-bundle/build-local.ps1 -Output "$env:RUNNER_TEMP/hermes-artifacts" -Report "$env:RUNNER_TEMP/hermes-report/paths.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ matrix.platform }}
          path: ${{ runner.temp }}/hermes-artifacts/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.platform }}
          path: ${{ runner.temp }}/hermes-report
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/hermes-bundle-v')
    needs: [build, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate bundle tag
        env:
          BUNDLE_TAG: ${{ github.ref_name }}
        run: python3 -c 'import json,os; assert json.load(open("scripts/hermes-bundle/bundle.json"))["release"] == os.environ["BUNDLE_TAG"]'
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          name: Hermes native runtime bundle
          body: 'Native Ubuntu 24.04 software for Clawmacdo provisioning. Built from pinned sources and verified on fresh amd64 and arm64 VMs. No user credentials or sessions are included.'
          files: artifacts/*
