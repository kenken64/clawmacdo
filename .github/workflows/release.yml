name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (defaults to the selected ref)
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full builds (all features)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: clawmacdo-linux-amd64-full
            features: ""
            binary_name: clawmacdo
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: clawmacdo-darwin-arm64-full
            features: ""
            binary_name: clawmacdo
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            artifact: clawmacdo-windows-amd64-full
            features: ""
            binary_name: clawmacdo.exe

          # Minimal builds (CLI only, no web UI)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: clawmacdo-linux-amd64-minimal
            features: "--no-default-features --features minimal"
            binary_name: clawmacdo
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: clawmacdo-darwin-arm64-minimal
            features: "--no-default-features --features minimal"
            binary_name: clawmacdo
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            artifact: clawmacdo-windows-amd64-minimal
            features: "--no-default-features --features minimal"
            binary_name: clawmacdo.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.features }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # Hosted runners also select mirrors through mirror+file source lists.
          for source in /etc/apt/apt-mirrors*.txt /etc/apt/apt-security-mirrors*.txt \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -E -i 's#https?://azure[.]archive[.]ubuntu[.]com/#https://archive.ubuntu.com/#g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update
          sudo apt-get install -y libssl-dev pkg-config
          if echo "${{ matrix.target }}" | grep -q windows; then
            sudo apt-get install -y gcc-mingw-w64-x86-64
          fi

      - name: Build
        shell: bash
        env:
          RUST_BACKTRACE: "1"
          RUSTC_WRAPPER: sccache
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Strip binary (Linux/macOS)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          if command -v strip >/dev/null 2>&1; then
            strip target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          fi

      - name: Package (Unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.artifact }}.tar.gz ${{ matrix.binary_name }}
          cd ../../..

      - name: Package (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        run: |
          cd target/${{ matrix.target }}/release
          zip ../../../${{ matrix.artifact }}.zip ${{ matrix.binary_name }}
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          # Hosted runners also select mirrors through mirror+file source lists.
          for source in /etc/apt/apt-mirrors*.txt /etc/apt/apt-security-mirrors*.txt \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -E -i 's#https?://azure[.]archive[.]ubuntu[.]com/#https://archive.ubuntu.com/#g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Run tests
        run: cargo test --workspace

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate release body
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PYNOTES'
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          changelog = Path("CHANGELOG.md").read_text()
          marker = f"## {tag}\n"
          if marker not in changelog:
              raise SystemExit(f"No CHANGELOG entry found for {tag}")
          notes = changelog.split(marker, 1)[1].split("\n## ", 1)[0].strip()
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{tag}/CHANGELOG.md"
          Path("release_notes.md").write_text(f"{notes}\n\n[Full changelog]({url})\n")
          PYNOTES

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release_notes.md
          files: |
            *.tar.gz
            *.zip
